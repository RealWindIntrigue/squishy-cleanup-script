<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1033"/>
      <stop offset="55%" stop-color="#241539"/>
      <stop offset="100%" stop-color="#120a22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9ecb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff9ecb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ec5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8ec5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <circle cx="150" cy="80" r="140" fill="url(#glow1)"/>
  <circle cx="1050" cy="300" r="160" fill="url(#glow2)"/>

  <g opacity="0.12" fill="none" stroke="#ffffff" stroke-width="1.5">
    <circle cx="120" cy="60" r="34"/>
    <circle cx="180" cy="120" r="20"/>
    <circle cx="1090" cy="70" r="30"/>
    <circle cx="1040" cy="130" r="18"/>
    <circle cx="90" cy="300" r="24"/>
    <circle cx="1120" cy="310" r="40"/>
  </g>

  <g opacity="0.08" fill="#ffffff">
    <circle cx="250" cy="40" r="6"/>
    <circle cx="950" cy="40" r="8"/>
    <circle cx="60" cy="200" r="5"/>
    <circle cx="1150" cy="200" r="7"/>
    <circle cx="600" cy="30" r="4"/>
  </g>

  <line x1="80" y1="330" x2="1120" y2="330" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" fill="#ffffff" font-weight="600">
    Clean Squishies Script
  </text>

  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Sweep script for cluttered squishy toy inventories —</tspan>
    <tspan x="600" dy="30">tidies duplicate entries and stale listings automaticall…</tspan>
